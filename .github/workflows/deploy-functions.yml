name: Deploy server functions
# Deploys supabase/functions/* whenever they change on main.
# One-time setup (repo Settings > Secrets and variables > Actions):
#   SUPABASE_ACCESS_TOKEN  personal access token from supabase.com/dashboard/account/tokens
#   SUPABASE_PROJECT_REF   the part before .supabase.co in your project URL
on:
  push:
    branches: [main]
    paths: ["supabase/functions/**"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ vars.DEPLOY_FUNCTIONS != 'off' }}
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - name: Skip if not configured
        id: cfg
        run: if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$PROJECT_REF" ]; then echo "Add SUPABASE_ACCESS_TOKEN and SUPABASE_PROJECT_REF secrets to deploy."; echo "skip=1" >> "$GITHUB_OUTPUT"; fi
      - uses: supabase/setup-cli@v1
        if: steps.cfg.outputs.skip != '1'
        with: { version: latest }
      - if: steps.cfg.outputs.skip != '1'
        run: |
          supabase functions deploy snapshot --project-ref "$PROJECT_REF"
          supabase functions deploy sentinel --project-ref "$PROJECT_REF" --no-verify-jwt
